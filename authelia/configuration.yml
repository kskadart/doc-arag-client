---
# Authelia for the OREO assistant. Rendered with the `template` filter
# (X_AUTHELIA_CONFIG_FILTERS=template in compose.yml) so DOMAIN comes from the
# environment. Secrets are NOT here: compose passes them as
# AUTHELIA_SESSION_SECRET, AUTHELIA_STORAGE_ENCRYPTION_KEY and
# AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET.
#
# Reference: https://www.authelia.com/configuration/prologue/introduction/

theme: 'auto'

server:
  address: 'tcp://:9091/'

log:
  level: 'info'
  format: 'text'

# Self-service password reset is disabled (authentication_backend below). The
# JWT secret for reset links is still read from the environment, so turning
# the feature back on needs no new secret
identity_validation:
  reset_password:
    jwt_lifespan: '5 minutes'

totp:
  issuer: '{{ env "DOMAIN" }}'

# Users live in a YAML file next to this one (users.yml, not committed).
# Later this block can become an ldap: backend for the corporate directory
# without touching anything else.
authentication_backend:
  # No "Reset password?" link on the login page: users cannot reset their own
  # password, an administrator replaces the hash in users.yml instead
  password_reset:
    disable: true
  file:
    path: '/config/users.yml'
    watch: true
    password:
      algorithm: 'argon2'
      argon2:
        variant: 'argon2id'
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

# First matching rule wins. Document management is for the admin group (the
# same AUTH_ADMIN_GROUP the backend checks), everything else (chat, /api/query,
# /api/tasks, /api/me) for any signed-in user. The backend enforces the group
# again; this rule mainly keeps non-admin uploads from reaching it at all.
access_control:
  default_policy: 'deny'
  rules:
    - domain: '{{ env "DOMAIN" }}'
      resources:
        - '^/api/(uploads|embeddings|documents|scrappings)([/?].*)?$'
      subject:
        - 'group:{{ env "AUTH_ADMIN_GROUP" }}'
      policy: 'one_factor'
    - domain: '{{ env "DOMAIN" }}'
      resources:
        - '^/api/(uploads|embeddings|documents|scrappings)([/?].*)?$'
      policy: 'deny'
    - domain: '{{ env "DOMAIN" }}'
      policy: 'one_factor'

session:
  name: 'authelia_session'
  same_site: 'lax'
  inactivity: '1h'
  expiration: '12h'
  remember_me: '1M'
  cookies:
    - domain: '{{ env "DOMAIN" }}'
      authelia_url: 'https://auth.{{ env "DOMAIN" }}'
      default_redirection_url: 'https://{{ env "DOMAIN" }}'

# Login brute-force protection
regulation:
  max_retries: 3
  find_time: '2 minutes'
  ban_time: '5 minutes'

storage:
  local:
    path: '/data/db.sqlite3'

# No SMTP yet: identity-verification mails (e.g. 2FA enrolment) land in this file inside
# the authelia_data volume (docker exec doc-arag-authelia cat /data/notification.txt).
# Replace with an smtp: block when a mail relay is available.
notifier:
  disable_startup_check: true
  filesystem:
    filename: '/data/notification.txt'
