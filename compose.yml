services:
  client:
    image: ${IMAGE_TAG:-doc-arag-client:local}
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: doc-arag-client
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - arag-common-network
    depends_on:
      - caddy

  caddy:
    image: caddy:2-alpine
    container_name: doc-arag-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Caddyfile plus the auth.*.caddy / portal.*.caddy snippets it imports
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - BACKEND_API_HOST=${BACKEND_API_HOST:-api}
      - BACKEND_API_PORT=${BACKEND_API_PORT:-8103}
      - API_PATH=${API_PATH:-/api}
      # on: every request goes through Authelia (needs the `auth` profile below)
      - AUTH_MODE=${AUTH_MODE:-off}
      # Sent to the backend as X-Auth-Proxy-Secret; the same value as the
      # backend's AUTH_PROXY_SECRET. Required when AUTH_MODE=on
      - AUTH_PROXY_SECRET=${AUTH_PROXY_SECRET:-}
      # e.g. local_certs when DOMAIN is a made-up name from /etc/hosts
      - CADDY_GLOBAL_OPTIONS=${CADDY_GLOBAL_OPTIONS:-}
    restart: unless-stopped
    networks:
      - arag-common-network

  # Login portal + forward-auth decisions for Caddy. Started only with
  # `COMPOSE_PROFILES=auth` (or `docker compose --profile auth up`), together
  # with AUTH_MODE=on for Caddy and AUTH_TRUSTED_HEADERS=true for the backend.
  authelia:
    image: authelia/authelia:4.39.27
    container_name: doc-arag-authelia
    profiles: ["auth"]
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      # Not in git; copy authelia/users.example.yml and put real hashes in
      - ./authelia/users.yml:/config/users.yml
      - authelia_data:/data
    environment:
      - X_AUTHELIA_CONFIG=/config/configuration.yml
      - X_AUTHELIA_CONFIG_FILTERS=template
      - DOMAIN=${DOMAIN:-localhost}
      # Must match the backend's AUTH_ADMIN_GROUP
      - AUTH_ADMIN_GROUP=${AUTH_ADMIN_GROUP:-admins}
      # Three independent random strings, e.g. `openssl rand -hex 32` each.
      # Authelia refuses to start while they are empty.
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET:-}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${AUTHELIA_STORAGE_ENCRYPTION_KEY:-}
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET=${AUTHELIA_JWT_SECRET:-}
    restart: unless-stopped
    networks:
      - arag-common-network

# Use the external network created by the backend
networks:
  arag-common-network:
    external: true
    name: arag-common-network

volumes:
  caddy_data:
  caddy_config:
  authelia_data:
