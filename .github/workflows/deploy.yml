name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    name: Run CI checks
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            if [ ! -d /opt/doc-arag-client ]; then
              sudo mkdir -p /opt/doc-arag-client
              sudo chown $USER:$USER /opt/doc-arag-client
            fi
            mkdir -p /opt/doc-arag-client/caddy /opt/doc-arag-client/authelia

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "compose.yml,caddy,authelia"
          target: "/opt/doc-arag-client"
          strip_components: 0

      # authelia/users.yml is not in git: it comes from the AUTHELIA_USERS_YML_B64
      # secret (`base64 < users.yml | tr -d '\n'`, one line so it survives the
      # SSH action); when the secret is empty the file already on the server is kept
      - name: Install Authelia user database
        if: ${{ vars.AUTH_MODE == 'on' }}
        uses: appleboy/ssh-action@v1.0.3
        env:
          AUTHELIA_USERS_YML_B64: ${{ secrets.AUTHELIA_USERS_YML_B64 }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: AUTHELIA_USERS_YML_B64
          script: |
            USERS=/opt/doc-arag-client/authelia/users.yml
            BEFORE=$(sha256sum "$USERS" 2>/dev/null | cut -d' ' -f1)
            if [ -n "$AUTHELIA_USERS_YML_B64" ]; then
              umask 077
              printf '%s' "$AUTHELIA_USERS_YML_B64" | base64 -d > "$USERS"
            fi
            # Authelia's file watcher does not pick up this in-place rewrite of the
            # bind-mounted file, so restart it when the user database really changed
            # (an unchanged file keeps everyone's sessions)
            AFTER=$(sha256sum "$USERS" 2>/dev/null | cut -d' ' -f1)
            if [ "$BEFORE" != "$AFTER" ] && [ -n "$(docker ps -q -f name=^doc-arag-authelia$)" ]; then
              docker restart doc-arag-authelia
              echo "users.yml changed: Authelia restarted"
            fi
            if [ ! -s /opt/doc-arag-client/authelia/users.yml ]; then
              echo "authelia/users.yml is missing: set the AUTHELIA_USERS_YML_B64 secret" >&2
              exit 1
            fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/doc-arag-client

            # Export environment variables
            export IMAGE_TAG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            export DOMAIN=${{ vars.DOMAIN || 'localhost' }}
            export BACKEND_API_HOST=${{ vars.BACKEND_API_HOST || 'api' }}
            export BACKEND_API_PORT=${{ vars.BACKEND_API_PORT || '8103' }}
            export API_PATH=${{ vars.API_PATH || '/api' }}

            # Authentication stays off until the repository variable AUTH_MODE=on is
            # set together with the AUTHELIA_* and AUTH_PROXY_SECRET secrets
            export AUTH_MODE=${{ vars.AUTH_MODE || 'off' }}
            if [ "$AUTH_MODE" = "on" ]; then export COMPOSE_PROFILES=auth; fi
            export AUTH_PROXY_SECRET='${{ secrets.AUTH_PROXY_SECRET }}'
            export AUTH_ADMIN_GROUP=${{ vars.AUTH_ADMIN_GROUP || 'admins' }}
            export AUTHELIA_SESSION_SECRET='${{ secrets.AUTHELIA_SESSION_SECRET }}'
            export AUTHELIA_STORAGE_ENCRYPTION_KEY='${{ secrets.AUTHELIA_STORAGE_ENCRYPTION_KEY }}'
            export AUTHELIA_JWT_SECRET='${{ secrets.AUTHELIA_JWT_SECRET }}'

            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Create network if not exists
            docker network create arag-common-network 2>/dev/null || true
            
            # Deploy
            docker compose -f compose.yml pull
            docker compose -f compose.yml up -d --remove-orphans --no-build

            # Recreate Caddy to guarantee it picks up the newly copied Caddyfile
            docker compose -f compose.yml stop caddy || true
            docker compose -f compose.yml rm -f caddy || true
            docker rm -f doc-arag-caddy 2>/dev/null || true
            docker compose -f compose.yml pull caddy
            docker compose -f compose.yml up -d --no-deps --force-recreate caddy
            
            # Cleanup old images
            docker image prune -f

